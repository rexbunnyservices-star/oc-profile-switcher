name: Self-test

# Dogfooding: runs the action from this commit against the live GitHub API for
# the repository owner and publishes the cards to the profilescape-output branch.

on:
  schedule:
    - cron: "41 4 * * *" # daily, off the hour to dodge the scheduler rush
  workflow_dispatch:

permissions: {}

concurrency:
  group: self-test
  cancel-in-progress: false

jobs:
  live:
    name: Render live cards
    # Scheduled runs only upstream; forks can still run it by hand for their own account.
    if: github.repository == 'chethandvg/profilescape' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Profilescape from this commit
        id: profilescape
        uses: ./
        with:
          username: ${{ github.repository_owner }}
          cards: hero,stats,3d,languages,repos,grid,stack,socials
          publish: branch
          branch: profilescape-output
          # An optional personal access token also exercises private contributions.
          token: ${{ secrets.PROFILESCAPE_TOKEN || github.token }}

      - name: Verify the rendered files
        env:
          FILES: ${{ steps.profilescape.outputs.files }}
          BASE_URL: ${{ steps.profilescape.outputs.base_url }}
        run: |
          # `files` is a JSON array of workspace-relative paths.
          count=0
          first=""
          while IFS= read -r file; do
            if [ ! -s "$file" ]; then
              echo "::error title=Missing output::$file is missing or empty."
              exit 1
            fi
            if ! grep -q '<svg' "$file"; then
              echo "::error title=Invalid output::$file is not an SVG."
              exit 1
            fi
            count=$((count + 1))
            [ -n "$first" ] || first="$(basename "$file")"
          done < <(jq -r '.[] | select(endswith(".svg"))' <<< "$FILES")
          if [ "$count" -eq 0 ]; then
            echo "::error title=Nothing rendered::The action reported no files."
            exit 1
          fi
          echo "Verified $count SVG files."
          if [ -z "$BASE_URL" ]; then
            echo "::error title=Missing output::The base_url output is empty."
            exit 1
          fi
          # raw.githubusercontent.com can take a moment to serve a brand-new branch.
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 --retry-all-errors \
            --output /dev/null "$BASE_URL/$first"
          echo "Published files are served from $BASE_URL"
